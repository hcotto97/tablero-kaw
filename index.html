<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaw Ixqa'al IV · Tablero de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface2:#E9F1F0; --line:#DAE5E3; --ink:#123634; --muted:#4F6D6A; --faint:#8EA7A4;
  --accent:#0E8A80; --accent-ink:#FFFFFF; --accent-soft:#D7F4F0; --mint:#80FFF3;
  --ok:#23885F; --warn:#B98100; --bad:#D9501A; --info:#0E8A80; --na:#7C9592;
  --ok-bg:#DDF2E8; --warn-bg:#FBEFC9; --bad-bg:#FBE0D3; --info-bg:#D7F4F0; --na-bg:#E6EEEC;
  --oe1:#14A89D; --oe2:#7B6CF6; --oe3:#E0A21B; --oeA:#8AA3A0;
  --shadow:0 1px 2px rgba(18,54,52,.06),0 6px 20px rgba(18,54,52,.05);
  --head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#052E2C; --surface:#0B403C; --surface2:#0F4C47; --line:#1C5A55; --ink:#F1FAF9; --muted:#9CC7C2; --faint:#6AA19B;
  --accent:#4AD9CC; --accent-ink:#052E2C; --accent-soft:#12504A; --mint:#80FFF3;
  --ok:#69D6A5; --warn:#F2C45A; --bad:#FF8352; --info:#4AD9CC; --na:#8DB4AF;
  --ok-bg:#14503C; --warn-bg:#51420F; --bad-bg:#5A2A17; --info-bg:#12504A; --na-bg:#17504B;
  --oe1:#4AD9CC; --oe2:#A79CFF; --oe3:#F2C45A; --oeA:#8DB4AF;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;margin:0;line-height:1.1}
h1{font-size:clamp(32px,5vw,48px)} h2{font-size:25px} h3{font-size:20px}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 24px;margin-bottom:14px}
.sub{color:var(--muted);margin-top:4px}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}

/* controles fijos */
.ctrl{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0 10px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.ctrl-row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.cut{display:flex;align-items:center;gap:12px;flex:1 1 440px;min-width:0}
.cut label{font-size:13.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.cut input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);height:28px}
.cut output{font-family:var(--head);font-size:22px;font-weight:700;min-width:130px;color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill:hover{border-color:var(--accent);color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lab{font-size:13.5px;color:var(--muted);font-weight:600;margin-right:2px}
.tabs{display:flex;gap:2px;margin:6px 0 18px;overflow-x:auto}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:9px 16px 7px;font-family:var(--head);font-size:21px;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card+.card,.card+.row,.row+.card,.kpis+.card,.card+.kpis,.row+.row{margin-top:16px}
.row{display:grid;gap:16px}
.row.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.row.explore{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}
@media (max-width:920px){.row.two,.row.explore{grid-template-columns:1fr}}
.cap{color:var(--muted);font-size:14px;margin-top:5px;max-width:72ch}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:'';width:8px;height:8px;background:currentColor;border-radius:50%}
.chip.warn::before{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.chip.bad::before{border-radius:1px;transform:rotate(45deg)}
.chip.ok{color:var(--ok);background:var(--ok-bg)}.chip.warn{color:var(--warn);background:var(--warn-bg)}.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}.chip.na{color:var(--na);background:var(--na-bg)}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:16px 0 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:var(--head);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}

svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body)}
.tri-wrap{max-width:430px;margin:4px auto 0}
.tri-grid{fill:none;stroke:var(--line);stroke-width:1}
.tri-axis{stroke:var(--line);stroke-width:1}
.tri-ideal{fill:none;stroke:var(--faint);stroke-width:1.8;stroke-dasharray:6 5}
.tri-real{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.dot{stroke:var(--surface);stroke-width:2.5}
.dot.ok{fill:var(--ok)}.dot.warn{fill:var(--warn)}.dot.bad{fill:var(--bad)}.dot.info{fill:var(--info)}.dot.na{fill:var(--na)}
.tl-n{fill:var(--muted);font-size:13px;font-weight:600}
.tl-v{font-size:30px;font-weight:700;font-family:var(--head)}
.tl-s{font-size:12.5px;font-weight:600;fill:var(--muted)}
.tl-v.ok{fill:var(--ok)}.tl-v.warn{fill:var(--warn)}.tl-v.bad{fill:var(--bad)}.tl-v.info{fill:var(--info)}.tl-v.na{fill:var(--na)}
.ring-t{fill:var(--faint);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid}
.sw.plan{border-color:var(--faint);border-top-style:dashed}.sw.real{border-color:var(--accent)}.sw.proy{border-color:var(--accent);border-top-style:dotted}
.sw.dotc{width:11px;height:11px;border:0;border-radius:50%}
.ax{stroke:var(--line);stroke-width:1}
.axt{fill:var(--muted);font-size:11.5px}.axt.cut{fill:var(--accent);font-weight:700}
.axl{fill:var(--ink);font-size:12.5px;font-weight:600}
.l-plan{fill:none;stroke:var(--faint);stroke-width:2.2;stroke-dasharray:6 5}
.l-real{fill:none;stroke:var(--accent);stroke-width:3.2}
.l-proy{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:1.5 5;stroke-linecap:round}
.cutline{stroke:var(--ink);stroke-opacity:.35;stroke-width:1.3;stroke-dasharray:3 4}
.diag{stroke:var(--faint);stroke-width:1.6;stroke-dasharray:5 5;fill:none}
.refl{stroke:var(--faint);stroke-width:1.3;stroke-dasharray:2 4}
.hit{fill:transparent}
.bub{cursor:pointer;stroke:var(--surface);stroke-width:2;fill-opacity:.82;transform-box:fill-box}
.bub:hover,.bub:focus{fill-opacity:1;stroke:var(--ink)}
.bub.sel{stroke:var(--ink);stroke-width:3;fill-opacity:1}
.bub.c-ok{fill:var(--ok)}.bub.c-warn{fill:var(--warn)}.bub.c-bad{fill:var(--bad)}.bub.c-info{fill:var(--info)}.bub.c-na{fill:var(--na)}
.bub.o-1{fill:var(--oe1)}.bub.o-2{fill:var(--oe2)}.bub.o-3{fill:var(--oe3)}.bub.o-A{fill:var(--oeA)}.bub.o-0{fill:var(--accent)}
.blab{fill:var(--ink);font-size:11.5px;font-weight:700;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.hint{fill:var(--faint);font-size:12px;font-style:italic}

.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.tools label{font-size:13px;color:var(--muted);display:inline-flex;flex-direction:column;gap:2px;font-weight:600}
select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;max-width:100%}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.how{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.how b{font-weight:700}

.st{display:flex;flex-direction:column;min-width:78px}
.st span{font-size:12px;color:var(--muted)}
.st b{font-family:var(--head);font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;margin:12px 0}
.mini{margin-top:12px}
.mini h4{font-size:16px;color:var(--muted);margin-bottom:6px}
.mi{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.mi:first-of-type{border-top:0}
.mi span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{position:relative;height:9px;background:var(--surface2);border-radius:999px;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--sc)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bar.ok{--sc:var(--ok)}.bar.warn{--sc:var(--warn)}.bar.bad{--sc:var(--bad)}.bar.info{--sc:var(--info)}.bar.na{--sc:var(--na)}.bar.acc{--sc:var(--accent)}
.rank{display:grid;gap:4px}
.rk{display:grid;grid-template-columns:minmax(120px,300px) minmax(0,1fr) 84px;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;cursor:pointer;font-size:13.5px}
.rk:hover,.rk.sel{background:var(--accent-soft)}
.rk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .tr{position:relative;height:12px}
.rk .tr i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.rk .tr i.neg{background:var(--bad)}
.rk .tr u{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.rk b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.rk{grid-template-columns:90px minmax(0,1fr) 70px}}

.budrow{display:grid;grid-template-columns:minmax(150px,260px) minmax(0,1fr) 190px;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.budrow:first-of-type{border-top:0}
.budrow .trk{position:relative;height:18px;background:var(--surface2);border-radius:6px}
.budrow .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.budrow .plan{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.budrow .val{text-align:right;font-variant-numeric:tabular-nums}
.budrow .val small{display:block;color:var(--muted);font-size:12px}
@media (max-width:720px){.budrow{grid-template-columns:1fr}.budrow .val{text-align:left}}

.attn{list-style:none;margin:8px 0 0;padding:0}
.attn li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.attn li:first-child{border-top:0}
.attn .t{font-weight:600}.attn .r{font-size:13.5px;color:var(--muted)}

.scroller{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;vertical-align:bottom}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td.t,.tbl th.t{text-align:left;white-space:normal;min-width:230px}
.tbl td.n{font-variant-numeric:tabular-nums}
.tbl tr.grp td{background:var(--surface2);font-weight:700}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--surface2)}
.tbl .sticky{position:sticky;left:0;z-index:1;background:var(--surface)}
.tbl tr.grp .sticky,.tbl tfoot .sticky{background:var(--surface2)}
.tbl td.sticky.t,.tbl th.sticky.t{min-width:280px;max-width:280px}
.tbl .post{opacity:.45}
.tbl th small{display:block;font-weight:400;font-size:11px;color:var(--faint)}
.tbl th.cutc{box-shadow:inset 0 -3px 0 var(--accent);color:var(--accent)}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;margin-right:8px}
.heat td.n{padding:5px 4px;min-width:50px;text-align:center}

.oe{margin-top:26px}.oe:first-child{margin-top:0}
.oe-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:flex-end;margin-bottom:12px}
.oe-h p{color:var(--muted);font-size:14px;max-width:75ch;margin-top:4px}
.oe-n{display:flex;gap:22px;flex-wrap:wrap}
details.res{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px;box-shadow:var(--shadow)}
details.res>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center}
details.res>summary::-webkit-details-marker{display:none}
details.res>summary .r-name{flex:1 1 320px;font-weight:600;font-size:15px;line-height:1.35}
details.res>summary .r-name::before{content:'';display:inline-block;width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);margin-right:12px;transition:transform .15s}
details.res[open]>summary .r-name::before{transform:rotate(45deg)}
.res-b{padding:2px 16px 18px}
.res-b h4{font-size:18px;margin:16px 0 8px;color:var(--accent)}
.foot{margin-top:28px;color:var(--muted);font-size:13.5px}
.foot details{margin-top:8px}.foot summary{cursor:pointer;font-weight:600;color:var(--ink)}
.foot ul{margin:8px 0 0;padding-left:20px;max-width:90ch}.foot li{margin-top:4px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 11px;border-radius:10px;max-width:290px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tip b{font-weight:700}.tip i{font-style:normal;opacity:.75}
.empty{padding:26px;text-align:center;color:var(--muted)}
@media (max-width:700px){.ctrl{position:static;margin:0 -12px 8px;padding-left:12px;padding-right:12px}.cut{flex-basis:100%;flex-wrap:wrap}.cut input[type=range]{flex:1 1 100%;order:3}.cut output{min-width:0;font-size:20px}.kpi{min-width:0;padding:12px}.kpi b{font-size:22px}.wrap{padding-left:12px;padding-right:12px}}

.lock{margin-top:8px;font-size:13.5px;background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:7px 12px}
.lock[hidden]{display:none}
.thb{background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-align:inherit}
.thb:hover{color:var(--ink)}
.tbl th[data-act="sort"]{cursor:pointer}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:var(--accent-soft)}.tbl tr.clk.sel td{background:var(--accent-soft);font-weight:600}
.zl{font-size:12.5px;font-weight:700}
.defs{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}.defs li{margin-top:6px}.defs b{color:var(--ink)}
details.cust{margin:12px 0 4px}
details.cust>summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.tbl th.t{min-width:200px}
.tbl td .chip{white-space:normal;text-align:left}
.tbl tr.clk td:last-child{min-width:150px}
@media (prefers-reduced-motion:no-preference){.pill,.tab{transition:background-color .15s,color .15s}}
</style>

var state={cut:LAST,tab:'panorama',filt:'all',level:'res',preset:'rinde',x:'pe',y:'avance',size:'bud',color:'estado',clip:true,sel:null,verif:'cap',sortBy:'rend',sortDir:'desc',mview:'real',mlevel:'res',open:{},armReset:false,playing:false};
var PRESETS={

var METRICS={

/* ---------- utilidades ---------- */
function sum(a,i,j){ var s=0; for(var k=i;k<=j;k++) s+=a[k]||0; return s; }
function tot(a){ return a.reduce(function(s,x){return s+x;},0); }
function $(n){ return (n<0?'−⁠':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US'); }
function sg(n){ return Math.round(n)===0?'$0':(n>0?'+':'−⁠')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US'); }
function P(n){ return Math.round(n)+'%'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function planAt(l,i){ return l.y[Math.floor(i/12)]/12; }
function chip(k,t){ return '<span class="chip '+k+'">'+t+'</span>'; }
function trunc(s,n){ return s.length>n?s.slice(0,n-1)+'…':s; }
function fm(k,v){
  if(v==null||!isFinite(v)) return '—';
  var u=METRICS[k].u;
  if(u==='$'||u==='$/pt') return $(v)+(u==='$/pt'?' por pt':'');
  if(u==='%') return P(v);
  if(u==='x') return v.toFixed(2)+'×';
  if(u==='pts') return (v>0?'+':(v<0?'−':''))+Math.abs(Math.round(v))+' pts';
  return String(v);
}
function fax(k,v){
  var u=METRICS[k].u;
  if(u==='$'||u==='$/pt') return Math.abs(v)>=1000?'$'+Math.round(v/1000)+'k':'$'+Math.round(v);
  if(u==='%') return Math.round(v)+'%'; if(u==='x') return (Math.round(v*10)/10)+'×'; return Math.round(v)+'';
}

/* ---------- estructura ---------- */
var RES=[],OBJ={},OG=[];
D.inds.forEach(function(i){
  if(i.objective==='OG'){ OG.push(i); return; }
  if(!OBJ[i.objective]) OBJ[i.objective]={code:i.objective,text:i.objective_text,inds:[],results:[]};
  if(!i.result){ OBJ[i.objective].inds.push(i); return; }
  var r=RES.filter(function(x){return x.code===i.result;})[0];
  if(!r){ r={code:i.result,text:i.result_text,obj:i.objective,inds:[]}; RES.push(r); OBJ[i.objective].results.push(r); }
  r.inds.push(i);
});
var OBJS=Object.keys(OBJ).sort();
function resOf(l){ return save.map[l.id]!==undefined?save.map[l.id]:(l.res||'apoyo'); }
function resObj(code){ if(code==='apoyo') return 'Apoyo'; return RES.filter(function(r){return r.code===code;})[0].obj; }

/* ---------- cálculos ---------- */
function lineM(l,c){
  var bud=tot(l.y),plan=0,real=sum(l.m,0,c);
  for(var i=0;i<=c;i++) plan+=planAt(l,i);
  var proy=sum(l.m,LAST+1,NM-1),cierre=tot(l.m);
  return {l:l,bud:bud,plan:plan,real:real,proy:proy,cierre:cierre,saldo:bud-cierre,pe:bud?real/bud*100:(real>0?Infinity:0)};
}
function aggM(arr){
  var a={bud:0,plan:0,real:0,proy:0,cierre:0,saldo:0};
  arr.forEach(function(x){ a.bud+=x.bud;a.plan+=x.plan;a.real+=x.real;a.proy+=x.proy;a.cierre+=x.cierre;a.saldo+=x.saldo; });
  a.pe=a.bud?a.real/a.bud*100:0; return a;
}
function catM(cc,cut){
  var bud=tot(cc.y),plan=0; for(var i=0;i<=cut;i++) plan+=cc.y[Math.floor(i/12)]/12;
  var real=sum(cc.m,0,cut),proy=sum(cc.m,LAST+1,NM-1),cierre=tot(cc.m);
  return {bud:bud,plan:plan,real:real,proy:proy,cierre:cierre,saldo:bud-cierre,pe:bud?real/bud*100:0};
}
function isPct(i){ return /^%/.test(i.text.trim()); }
function isIdx(i){ return /índice/i.test(i.text); }
function fv(i,v){
  if(v==null) return '—';
  if(isPct(i)){ var k=(i.meta!=null&&i.meta<=1)?100:1; return (Math.round(v*k*10)/10)+'%'; }
  if(isIdx(i)) return v.toFixed(2);
  return Math.round(v).toLocaleString('en-US');
}
function indM(i){
  var has=i.alc!=null&&i.alc>0&&i.meta>0, av=has?i.alc/i.meta:null, flag=has&&av>2, exp=(LAST+1)/NM, s;
  var eff=!has?0:(flag&&state.verif==='zero'?0:Math.min(1,av));
  if(!has) s={k:'na',t:'Sin reporte (0%)'};
  else if(flag) s={k:'warn',t:'Sobrecumplido, verificar'};
  else if(av>=1) s={k:'ok',t:'Cumplido'};
  else { var r=av/exp; s=r>=.95?{k:'ok',t:'Al ritmo'}:(r>=.8?{k:'warn',t:'Rezagado'}:{k:'bad',t:'Muy rezagado'}); }
  return {i:i,has:has,av:av,eff:eff,s:s,check:flag};
}
function signal(avg,pe,real){
  if(avg==null) return {k:'na',t:'Sin indicadores (apoyo)'};
  if(avg===0&&real===0) return {k:'na',t:'Sin avance ni gasto'};
  if(avg>=99&&pe>105) return {k:'warn',t:'Cumplido, gasto sobre el presupuesto'};
  var gap=avg-Math.min(pe,999);
  return gap<-30?{k:'bad',t:'Gasta más de lo que avanza'}:(gap>30?{k:'info',t:'Avanza con poco gasto'}:{k:'ok',t:'Gasto y avance alineados'});
}
function meanEff(inds){ return inds.length?inds.map(indM).reduce(function(s,m){return s+m.eff;},0)/inds.length*100:0; }
function resAvg(r){ return meanEff(r.inds); }
function objAvance(o){ var a=OBJ[o].inds.slice(); OBJ[o].results.forEach(function(r){ a=a.concat(r.inds); }); return meanEff(a); }
function calc(c){
  var results=RES.map(function(r){
    var ls=D.lines.filter(function(l){return resOf(l)===r.code;}).map(function(l){return lineM(l,c);});
    var a=aggM(ls),avg=resAvg(r);
    return {r:r,lines:ls,a:a,avg:avg,inds:r.inds.map(indM),sig:signal(avg,a.pe,a.real)};
  });
  var apoyo=D.lines.filter(function(l){return resOf(l)==='apoyo';}).map(function(l){return lineM(l,c);});
  var resLines=[]; results.forEach(function(r){resLines=resLines.concat(r.lines);});
  var cats={personal:catM(D.cats.personal,c),beneficios:catM(D.cats.beneficios,c),indirectos:catM(D.cats.indirectos,c)};
  var gRes=aggM(resLines),gAp=aggM(apoyo),all=aggM([gRes,gAp,cats.personal,cats.beneficios,cats.indirectos]);
  var allInds=OG.concat(RES.reduce(function(a,r){return a.concat(r.inds);},[])).concat(OBJS.reduce(function(a,o){return a.concat(OBJ[o].inds);},[])).map(indM);
  return {results:results,apoyo:apoyo,cats:cats,gRes:gRes,gAp:gAp,all:all,nInd:allInds.length,
    nZero:allInds.filter(function(x){return !x.has;}).length,
    flagged:allInds.filter(function(x){return x.check;}).map(function(x){return x.i.code.replace('Resultado ','').replace('Objetivo Específico ','OE ').replace('Objetivo General ','OG ');}),
    alcance:allInds.reduce(function(s,x){return s+x.eff;},0)/allInds.length};
}
function bandAlc(r){ return r==null?{k:'na',t:'Reporte desde ago 2026'}:(r>=.95?{k:'ok',t:'Al ritmo'}:(r>=.8?{k:'warn',t:'Rezagado'}:{k:'bad',t:'Muy rezagado'})); }
function bandCost(r){ return r<=1.05?{k:'ok',t:r<.8?'Bajo el ritmo':'Al ritmo'}:(r<=1.2?{k:'warn',t:'Sobre el ritmo'}:{k:'bad',t:'Muy sobre el ritmo'}); }

/* ---------- entidades para el explorador ---------- */
function finish(e){
  e.cp=e.bud?e.cierre/e.bud*100:null;
  e.pe=e.bud?e.real/e.bud*100:(e.real>0?null:0);
  e.ritmo=e.plan>0?e.real/e.plan*100:null;
  e.brecha=(e.avance!=null&&e.pe!=null)?e.avance-e.pe:null;
  e.rend=(e.avance!=null&&e.pe>0)?e.avance/e.pe:null;
  e.cpp=(e.avance!=null&&e.avance>0)?e.real/e.avance:null;
  e.sig=e.avance==null&&e.real===0?{k:'na',t:'Sin avance ni gasto'}:signal(e.avance,e.pe==null?999:e.pe,e.real);
  return e;
}
function monthlyOf(lines){
  var p=Array(NM).fill(0),v=Array(NM).fill(0);
  lines.forEach(function(l){ for(var i=0;i<NM;i++){ p[i]+=planAt(l,i); v[i]+=l.m[i]; } });
  return {p:p,v:v};
}
function entities(c){
  var G=calc(c),out=[];
  if(state.level==='res'){

      var a=mx?Math.min(1,Math.abs(x)/mx):0,bg='';
      if(Math.round(x)!==0) bg=' style="background:color-mix(in srgb,'+(v==='diff'&&x>0?'var(--bad)':'var(--accent)')+' '+Math.round(8+a*62)+'%,transparent)"';
      tb+='<td class="n'+(i>c?' post':'')+'"'+bg+' data-html="'+esc('<b>'+r.code+'</b> · '+mLong(i)+'<br>'+(v==='diff'?sg(x):$(x)))+'">'+(Math.round(x)===0?'<span style="color:var(--faint)">·</span>':(v==='diff'?sg(x).replace('$',''):Math.round(x).toLocaleString('en-US')))+'</td>';
    });
    tb+='<td class="n"><b>'+(v==='diff'?sg(t):$(t))+'</b></td></tr>';
  });
  var extra='';
  if(f==='all'){ [['personal','Personal'],['beneficios','Beneficios'],['indirectos','Costos indirectos']].forEach(function(k){ var cc=D.cats[k[0]],t=0; extra+='<tr><td class="t sticky" style="color:var(--muted)">'+k[1]+' <small>(solo ejecución total)</small></td>'; for(var i=0;i<NM;i++){ var pl=cc.y[Math.floor(i/12)]/12,x=v==='plan'?pl:(v==='real'?cc.m[i]:cc.m[i]-pl); colT[i]+=x; t+=x; extra+='<td class="n'+(i>c?' post':'')+'" style="color:var(--muted)">'+(v==='diff'?sg(x).replace('$',''):Math.round(x).toLocaleString('en-US'))+'</td>'; } extra+='<td class="n" style="color:var(--muted)">'+(v==='diff'?sg(t):$(t))+'</td></tr>'; }); }
  var foot='<tr><td class="t sticky">'+(f==='all'?'Total del proyecto':'Total del filtro')+'</td>',cum='<tr><td class="t sticky">Acumulado</td>',ca=0;
  for(var k=0;k<NM;k++){ ca+=colT[k]; foot+='<td class="n'+(k>c?' post':'')+'">'+(v==='diff'?sg(colT[k]).replace('$',''):Math.round(colT[k]).toLocaleString('en-US'))+'</td>'; cum+='<td class="n'+(k>c?' post':'')+'">'+(v==='diff'?sg(ca).replace('$',''):Math.round(ca).toLocaleString('en-US'))+'</td>'; }
  foot+='<td class="n">'+(v==='diff'?sg(tot(colT)):$(tot(colT)))+'</td></tr>'; cum+='<td class="n"></td></tr>';
  return h+'<section class="card" style="padding:12px"><div class="scroller"><table class="tbl heat" style="min-width:1750px"><thead>'+head+'</thead><tbody>'+tb+extra+'</tbody><tfoot>'+foot+cum+'</tfoot></table></div></section>';
}

/* ---------- Armazón y eventos ---------- */
var TABS=[['panorama','Panorama'],['explorador','Explorador'],['resultados','Resultados e indicadores'],['mensual','Mes a mes']];
var FILTS=[['all','Todo'],['OE 1','OE 1'],['OE 2','OE 2'],['OE 3','OE 3'],['Apoyo','Apoyo']];
var views={panorama:vPanorama,explorador:vExplorador,resultados:vResultados,mensual:vMensual};
var app=document.getElementById('app');
app.innerHTML='<header class="top"><div><h1>Kaw Ixqa’al Fase IV</h1><p class="sub">Gestión del proyecto: alcance, tiempo y costo. Presupuesto de $1,000,000 de nov 2024 a oct 2027.</p></div><button class="themebtn" id="theme" aria-label="Cambiar tema claro u oscuro"></button></header>'+
'<div class="ctrl"><div class="ctrl-row"><div class="cut"><label for="slider">Corte al cierre de</label><input id="slider" type="range" min="0" max="'+LAST+'" value="'+LAST+'"><output id="cutlab" for="slider"></output><button class="pill" id="play">▶ Reproducir</button><button class="pill" id="now">Último dato</button></div><div class="chips" id="chips"></div></div><div class="lock" id="lock" hidden></div></div>'+
'<div class="tabs" id="tabs" role="tablist"></div><main id="view"></main>'+
'<footer class="foot"><p>Fuentes: presupuesto GT-34128 al 31 ago 2026 (real hasta ago 2026, proyectado hasta oct 2027) e indicadores de la lista IPTT KI IV (SharePoint). Cifras en dólares.</p><details><summary>Cómo se calcula</summary><ul><li><b>Plan mensual:</b> el archivo solo trae el presupuesto por año del proyecto (nov a oct); se reparte en partes iguales por mes.</li><li><b>Avance programático:</b> promedio de <b>todos</b> los indicadores (33). Cada uno es alcanzado entre meta. Los que no han reportado cuentan 0%. Los sobrecumplidos se muestran con su valor real pero cuentan máximo 100%, para no inflar el promedio. Es el del último reporte (ago 2026): los indicadores no tienen historia mensual, por eso los cruces con avance están fijos en ese corte.</li><li><b>Indicadores a verificar:</b> los que superan el doble de su meta. En el Panorama se puede elegir que cuenten 100% o 0% hasta confirmarlos.</li><li><b>Rendimiento:</b> avance entre porcentaje del presupuesto gastado. 1.0× avanza lo mismo que gasta; más de 1.0× rinde.</li><li><b>Costo por punto de avance:</b> gastado entre puntos porcentuales de avance.</li><li><b>Estado:</b> compara avance y gasto. “Gasta más de lo que avanza” si el gasto supera al avance en más de 30 puntos.</li><li><b>Actividades:</b> heredan el avance del resultado al que pertenecen. El presupuesto no está dividido por indicador.</li><li><b>Cierre proyectado:</b> real hasta ago 2026 más lo proyectado de sep 2026 a oct 2027.</li></ul></details></footer>';
var view=document.getElementById('view');
function ctrl(){
  var lk=locked(),ce=cutEff(),sl=document.getElementById('slider');
  sl.value=ce; sl.disabled=lk;
  document.getElementById('cutlab').textContent=mLong(ce)+(lk?' (fijo)':'');
  document.getElementById('chips').innerHTML='<span class="lab">Filtrar</span>'+FILTS.map(function(f){return '<button class="pill'+(state.filt===f[0]?' on':'')+'" data-act="filt" data-v="'+f[0]+'">'+f[1]+'</button>';}).join('');
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(state.tab===t[0])+'">'+t[1]+'</button>';}).join('');
  document.getElementById('theme').textContent=save.theme==='light'?'Tema oscuro':'Tema claro';
  var pb=document.getElementById('play'); pb.disabled=lk; pb.textContent=state.playing?'❚❚ Pausar':'▶ Reproducir'; pb.classList.toggle('on',state.playing);
  var lo=document.getElementById('lock'); lo.hidden=!lk;
  if(lk) lo.innerHTML='<b>Corte fijo en agosto 2026.</b> Los indicadores solo tienen un reporte, así que el avance no se puede ver en meses anteriores. Para recorrer los meses usa “¿Vamos gastando lo planificado?” o “¿Alcanzará el presupuesto?”.';
  if(lk&&state.playing) stopPlay();
}
function renderView(){
  ctrl();
  var sc=[].map.call(view.querySelectorAll('.scroller'),function(e){return e.scrollLeft;}),y=window.scrollY;
  view.innerHTML=views[state.tab]();
  [].forEach.call(view.querySelectorAll('.scroller'),function(e,i){e.scrollLeft=sc[i]||0;});
  if(state.tab==='explorador') afterExplorer(); else prevPos={};
  window.scrollTo(0,y);
}
function renderAll(){ renderView(); }
var timer=null;
function stopPlay(){ state.playing=false; clearInterval(timer); timer=null; }
document.getElementById('slider').addEventListener('input',function(e){ if(locked()) return; state.cut=+e.target.value; document.getElementById('cutlab').textContent=mLong(state.cut); renderView(); });
document.getElementById('play').addEventListener('click',function(){
  if(locked()) return;
  if(state.playing){ stopPlay(); ctrl(); return; }
  state.playing=true; if(state.cut>=LAST) state.cut=0; ctrl(); renderView();
  timer=setInterval(function(){ if(state.cut>=LAST){ stopPlay(); ctrl(); return; } state.cut++; ctrl(); renderView(); },650);
});
document.getElementById('now').addEventListener('click',function(){ stopPlay(); state.cut=LAST; ctrl(); renderView(); });
document.getElementById('theme').addEventListener('click',function(){ save.theme=save.theme==='light'?'dark':'light'; document.documentElement.setAttribute('data-theme',save.theme); persist(); ctrl(); });
function applyPreset(k){ state.preset=k; var p=PRESETS[k]; if(k!=='libre'){ state.x=p.x;state.y=p.y;state.size=p.size;state.color=p.color; } }
document.addEventListener('click',function(e){
  var bub=e.target.closest&&e.target.closest('.bub'); if(bub){ state.sel=bub.getAttribute('data-id'); state.noAnim=true; renderView(); state.noAnim=false; return; }
  var b=e.target.closest&&e.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act;
  if(a==='tab'){ state.tab=b.dataset.v; state.armReset=false; ctrl(); }
  else if(a==='filt'){ state.filt=b.dataset.v; ctrl(); }
  else if(a==='preset') applyPreset(b.dataset.v);
  else if(a==='clip') state.clip=!state.clip;
  else if(a==='pick'){ state.sel=b.dataset.id; state.noAnim=true; }
  else if(a==='desel'){ state.sel=null; state.noAnim=true; }
  else if(a==='sort'){ var kk=b.dataset.v; if(state.sortBy===kk) state.sortDir=state.sortDir==='asc'?'desc':'asc'; else { state.sortBy=kk; state.sortDir=kk==='name'?'asc':'desc'; } }
  else if(a==='verif'){ state.verif=b.dataset.v; }
  else if(a==='mview') state.mview=b.dataset.v;
  else if(a==='mlevel') state.mlevel=b.dataset.v;
  else if(a==='openall') RES.forEach(function(r){state.open[r.code]=true;});
  else if(a==='closeall') state.open={};
  else if(a==='reset'){ if(!state.armReset){ state.armReset=true; renderView(); return; } save.map={}; persist(); state.armReset=false; }
  renderView(); state.noAnim=false;
});
document.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('bub')){ e.preventDefault(); state.sel=e.target.getAttribute('data-id'); state.noAnim=true; renderView(); state.noAnim=false; } });
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.ax){ var k=t.dataset.ax;
    if(k==='level'){ state.level=t.value; state.sel=null; prevPos={}; }
    else if(k==='rank') state.rank=t.value;
    else { state[k]=t.value; state.preset='libre'; }
  } else if(t.dataset.map){ var l=D.lines.filter(function(x){return x.id===t.dataset.map;})[0],def=l.res||'apoyo'; if(t.value===def) delete save.map[l.id]; else save.map[l.id]=t.value; persist(); }
  else return;
  renderView();
});
document.addEventListener('toggle',function(e){ var d=e.target; if(d&&d.classList&&d.classList.contains('res')) state.open[d.dataset.code]=d.open; },true);
var tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; document.body.appendChild(tip);
document.addEventListener('pointermove',function(e){
  var t=e.target.closest?e.target.closest('[data-html],.bub'):null;
  if(!t){ tip.hidden=true; return; }
  var html;
  if(t.classList.contains('bub')){
    var en=lastEnts.byId&&lastEnts.byId[t.getAttribute('data-id')]; if(!en){ tip.hidden=true; return; }
    html='<b>'+esc(en.short)+' · '+esc(trunc(en.name,80))+'</b><br><i>'+en.obj+'</i><br>'+esc(METRICS[state.x].l)+': <b>'+fm(state.x,en[state.x])+'</b><br>'+esc(METRICS[state.y].l)+': <b>'+fm(state.y,en[state.y])+'</b><br>Presupuesto '+$(en.bud)+' · gastado '+$(en.real)+''+((state.y==='avance'||state.x==='avance')?'':'<br>'+(en.avance==null?'Avance: sin dato':'Avance de indicadores: '+P(en.avance)));
  } else html=t.getAttribute('data-html');
  tip.innerHTML=html; tip.hidden=false;
  var w=tip.offsetWidth,hh=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(window.innerWidth-w-8,e.clientX+14))+'px';
  tip.style.top=Math.max(8,Math.min(window.innerHeight-hh-8,e.clientY+16))+'px';
});
document.addEventListener('pointerleave',function(){ tip.hidden=true; });
renderAll();
})();
</script>
